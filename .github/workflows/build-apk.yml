name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de depuración
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Pruebas de la lógica
        run: ./gradlew testDebugUnitTest
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AgroTrace.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AgroTrace-apk
          path: AgroTrace.apk
      - name: Publicar en Releases (descarga directa)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version AgroTrace.apk \
            --title "AgroTrace (última versión)" \
            --notes "APK generado automáticamente desde el commit ${GITHUB_SHA::7}. Descárgalo e instálalo en Android 7.0 o superior." \
            --target "$GITHUB_SHA"
